<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Hire a Minecraft Developer Freelancer</title>
  <meta name="description" content="Contact for Minecraft cinematic production, server setup, plugin development, and editing projects.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://yourdomain.com/contact.html">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Contact | Your Name Freelancing">
  <meta property="og:description" content="Share your goals and get a tailored project scope.">
  <meta property="og:url" content="https://yourdomain.com/contact.html">
  <meta property="og:image" content="https://yourdomain.com/assets/branding/freelancing-dev-logo.svg">

  <link rel="icon" href="assets/icons/site-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages/contact.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ContactPage",
    "name": "Contact Your Name Freelancing",
    "url": "https://yourdomain.com/contact.html"
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header id="site-navbar"></header>

  <main id="main-content" class="container page-content">
    <h1>Contact</h1>
    <p>Share your project requirements and timeline.</p>

    <form class="contact-form" action="#" method="post" aria-label="Contact form">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="service">Service Needed</label>
      <select id="service" name="service" required>
        <option value="">Select a service</option>
        <option>Minecraft Cinematic Video Creation</option>
        <option>Minecraft Server Setup</option>
        <option>Minecraft Plugin Development</option>
        <option>Video Editing</option>
      </select>

      <label for="message">Project Details</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button class="btn btn-primary" type="submit">Send Inquiry</button>
    </form>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/components.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
